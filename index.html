<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Temporarily unavailable</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #f9fafb; }
      main { width: min(38rem, calc(100% - 3rem)); text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.8rem, 5vw, 2.7rem); }
      p { margin: .45rem 0; color: #d1d5db; }
    </style>
  </head>
  <body>
    <main>
      <h1>Website temporarily unavailable</h1>
      <p>This personal website is temporarily offline. Please check back soon.</p>
    </main>
  </body>
</html>
